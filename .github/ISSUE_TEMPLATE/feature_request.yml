name: Feature request
description: Something ZenTerm should be able to do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: >
        The task, not the feature. What are you reaching for ZenTerm to do, and
        what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: >
        Optional. If you have a shape for it, say so. If a tool float or a config
        key already gets close, say what it misses.
    validations:
      required: false
