name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch/PR supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    # macos-26 ships Xcode 26 / Swift 6.2 — matches the toolchain the code is
    # formatted and developed against, so swift-format can't drift vs local.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  lint:
    name: Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      # Source-only — no build needed, so this runs fast and in parallel.
      - name: swift-format
        run: swift format lint --strict --recursive Sources Tests

      - name: SwiftLint
        run: swiftlint lint --strict --quiet Sources Tests
