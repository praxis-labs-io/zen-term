name: CI

on:
  # Draft PRs don't run CI — only once marked ready for review (ready_for_review),
  # plus pushes to a non-draft PR. See the per-job `if` guard below.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# A newer push to the same branch/PR supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    # Skip draft PRs; run on pushes to main and once a PR is ready for review.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # macos-26 ships Xcode 26 / Swift 6.2 — matches the toolchain the code is
    # formatted and developed against, so swift-format can't drift vs local.
    runs-on: macos-26
    steps:
      # No submodule content here on purpose: only the GhosttyKit cache-miss path needs
      # the ghostty source, and bin/build-ghosttykit inits the submodule itself. This
      # keeps the common (cache-hit) run from cloning ghostty at all.
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      # The GhosttyKit binaryTarget is linked unconditionally, so `swift build`
      # needs the xcframework — and the staged runtime resources are a declared SwiftPM
      # resource. Both are gitignored and built from the pinned vendor/ghostty
      # submodule — same model as ghostty's own CI. Cache the built artifacts keyed on
      # the ghostty pin + build script, so only a ghostty bump triggers the slow
      # Zig/Metal rebuild; every other run restores them in seconds.
      - name: Resolve ghostty pin
        id: pin
        run: echo "sha=$(git rev-parse HEAD:vendor/ghostty)" >> "$GITHUB_OUTPUT"

      - name: Cache GhosttyKit artifacts
        id: ghosttykit
        uses: actions/cache@v4
        with:
          path: |
            Frameworks/GhosttyKit.xcframework
            Sources/TerminalKit/Resources/ghostty-resources
          key: ghosttykit-${{ runner.os }}-${{ steps.pin.outputs.sha }}-${{ hashFiles('bin/build-ghosttykit') }}

      - name: Build GhosttyKit (cache miss only)
        if: steps.ghosttykit.outputs.cache-hit != 'true'
        run: |
          # Zig 0.15.2 can't link libSystem against the newest macOS SDK (undefined
          # __availability_version_check et al.), so pin the oldest Xcode 26.x on the
          # runner — the older SDK ghostty itself builds v1.3.1 against.
          echo "available xcodes:"; ls -d /Applications/Xcode_*.app 2>/dev/null || true
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | head -1)"
          [ -n "$XCODE" ] && sudo xcode-select -s "$XCODE"
          echo "selected: $(xcode-select -p) — SDK $(xcrun --sdk macosx --show-sdk-version)"
          xcodebuild -downloadComponent MetalToolchain
          bin/build-ghosttykit

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  lint:
    name: Lint
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      # Source-only — no build needed, so this runs fast and in parallel.
      - name: swift-format
        run: swift format lint --strict --recursive Sources Tests

      # SwiftLint isn't preinstalled on the macos-26 image (unlike older ones).
      - name: Install SwiftLint
        run: brew install swiftlint

      - name: SwiftLint
        run: swiftlint lint --strict --quiet Sources Tests
